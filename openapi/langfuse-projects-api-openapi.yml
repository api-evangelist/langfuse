        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Projects delete api key
      x-summary-source: derived
components:
  schemas:
    Organization:
      title: Organization
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the organization
        name:
          type: string
          description: The name of the organization
      required:
      - id
      - name
    ApiKeyList:
      title: ApiKeyList
      type: object
      description: List of API keys for a project
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
      required:
      - apiKeys
    Projects:
      title: Projects
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
      required:
      - data
    ApiKeyDeletionResponse:
      title: ApiKeyDeletionResponse
      type: object
      description: Response for API key deletion
      properties:
        success:
          type: boolean
      required:
      - success
    ApiKeyResponse:
      title: ApiKeyResponse
      type: object
      description: Response for API key creation
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiration timestamp. Null if the key does not expire.
        publicKey:
          type: string
        secretKey:
          type: string
        displaySecretKey:
          type: string
        name:
          type:
          - string
          - 'null'
          description: Name of the API key. Contains the same value as note; null if no name was provided.
        note:
          type:
          - string
          - 'null'
          description: Deprecated alias for name. Contains the same value as name.
          deprecated: true
      required:
      - id
      - createdAt
      - publicKey
      - secretKey
      - displaySecretKey
    Project:
      title: Project
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
          description: The organization this project belongs to
        metadata:
          type: object
          additionalProperties: true
          description: Metadata for the project
        retentionDays:
          type:
          - integer
          - 'null'
          description: Number of days to retain data. Null or 0 means no retention. Omitted if no retention is configured.
      required:
      - id
      - name
      - organization
      - metadata
    ApiKeySummary:
      title: ApiKeySummary
      type: object
      description: Summary of an API key
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiration timestamp. Null if the key does not expire.
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type:
          - string
          - 'null'
          description: Name of the API key. Contains the same value as note; null if no name was provided.
        note:
          type:
          - string
          - 'null'
          description: Deprecated alias for name. Contains the same value as name.
          deprecated: true
        publicKey:
          type: string
        displaySecretKey:
          type: string
      required:
      - id
      - createdAt
      - publicKey
      - displaySecretKey
    ProjectDeletionResponse:
      title: ProjectDeletionResponse
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
      - success
      - message
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
