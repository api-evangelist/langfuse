      summary: Projects get api keys
      x-summary-source: derived
    post:
      description: Create a new API key for a project (requires organization-scoped API key)
      operationId: projects_createApiKey
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  description: Optional name for the API key. Cannot be provided together with note, even if either value is an empty string.
                note:
                  type:
                  - string
                  - 'null'
                  description: Deprecated alias for name. Cannot be provided together with name, even if either value is an empty string.
                  deprecated: true
                expiresAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                  description: Optional expiration timestamp in ISO 8601 format. Must be in the future. Omit or set to null for a key that does not expire.
                publicKey:
                  type:
                  - string
                  - 'null'
                  description: Optional predefined public key. Must start with 'pk-lf-'. If provided, secretKey must also be provided.
                secretKey:
                  type:
                  - string
                  - 'null'
                  description: Optional predefined secret key. Must start with 'sk-lf-'. If provided, publicKey must also be provided.
      summary: Projects create api key
      x-summary-source: derived
  /api/public/projects/{projectId}/apiKeys/{apiKeyId}:
    delete:
      description: Delete an API key for a project (requires organization-scoped API key)
      operationId: projects_deleteApiKey
      tags:
