components:
  schemas:
    BlobStorageIntegrationResponse:
      title: BlobStorageIntegrationResponse
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        type:
          $ref: '#/components/schemas/BlobStorageIntegrationType'
        bucketName:
          type: string
        endpoint:
          type:
          - string
          - 'null'
        region:
          type: string
        accessKeyId:
          type:
          - string
          - 'null'
        prefix:
          type: string
        exportFrequency:
          $ref: '#/components/schemas/BlobStorageExportFrequency'
        enabled:
          type: boolean
        forcePathStyle:
          type: boolean
        fileType:
          $ref: '#/components/schemas/BlobStorageIntegrationFileTypeResponse'
        exportMode:
          $ref: '#/components/schemas/BlobStorageExportMode'
        exportStartDate:
          type:
          - string
          - 'null'
          format: date-time
        compressed:
          type: boolean
        exportSource:
          $ref: '#/components/schemas/BlobStorageExportSource'
        exportFieldGroups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BlobStorageExportFieldGroup'
          description: Field groups included in each exported observation row. An empty list is treated as all groups during export.
        nextSyncAt:
          type:
          - string
          - 'null'
          format: date-time
        lastSyncAt:
          type:
          - string
          - 'null'
          format: date-time
        lastError:
          type:
          - string
          - 'null'
        lastErrorAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectId
      - type
      - bucketName
      - endpoint
      - region
      - accessKeyId
      - prefix
      - exportFrequency
      - enabled
      - forcePathStyle
      - fileType
      - exportMode
      - exportStartDate
      - compressed
      - exportSource
      - exportFieldGroups
      - nextSyncAt
      - lastSyncAt
      - lastError
      - lastErrorAt
      - createdAt
      - updatedAt
    BlobStorageIntegrationDeletionResponse:
      title: BlobStorageIntegrationDeletionResponse
      type: object
      properties:
        message:
          type: string
      required:
      - message
    BlobStorageExportSource:
      title: BlobStorageExportSource
      type: string
      enum:
      - LEGACY_TRACES_OBSERVATIONS
      - OBSERVATIONS_V2
      - LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS
      description: 'What data the integration exports.

        - `LEGACY_TRACES_OBSERVATIONS`: traces, observations, and scores tables. Observation columns are controlled by `exportFieldGroups`; field groups without a counterpart in this data model (e.g. `trace_context`) are omitted.

        - `OBSERVATIONS_V2`: same data model as the `/api/public/v2/observations` endpoint, plus scores. Columns are controlled by `exportFieldGroups`.

        - `LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS`: both sets. Observation columns of both portions are controlled by `exportFieldGroups`.


        **Note:** which sources a deployment accepts depends on how far it has moved to the v4 data model. `OBSERVATIONS_V2` and the enriched-observations portion of `LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS` read the enriched observations table, so they require a deployment that already populates it. `LEGACY_TRACES_OBSERVATIONS` and the legacy portion of `LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS` read the legacy traces and observations tables, so they require a deployment that still populates those. A deployment part-way through the migration populates both and accepts every source. Selecting a source the deployment cannot serve is rejected with `400`, rather than exporting an empty result. See https://langfuse.com/docs/v4.'
    BlobStorageExportFieldGroup:
      title: BlobStorageExportFieldGroup
      type: string
      enum:
      - core
      - basic
      - time
      - io
      - metadata
      - model
      - usage
      - prompt
      - metrics
      - tools
      - trace_context
      description: Field group selecting which observation columns are included in the export. Applies to all export sources; groups without a counterpart in the legacy data model (e.g. `trace_context`) are omitted from the legacy observations export.
    BlobStorageIntegrationFileType:
      title: BlobStorageIntegrationFileType
      type: string
      enum:
      - JSON
      - CSV
      - JSONL
      - PARQUET
      description: File format for exported data. `PARQUET` is a columnar binary format encoded and compressed by the storage engine; gzip compression does not apply to it. Note that the model-price columns (`input_price`, `output_price`, `total_price`) are not included in Parquet observation exports.
    BlobStorageSyncStatus:
      title: BlobStorageSyncStatus
      type: string
      enum:
      - idle
      - running
      - queued
      - up_to_date
      - disabled
      - error
      description: 'Sync status of the blob storage integration:

        - `disabled` — integration is not enabled

        - `error` — last export failed (see `lastError` for details)

        - `running` — an export job is currently being processed

        - `queued` — next export is overdue (`nextSyncAt` is in the past) and waiting to be picked up by the worker

        - `idle` — enabled but has never exported yet and no export is queued

        - `up_to_date` — all available data has been exported; next export is scheduled for the future


        **ETL usage**: poll this endpoint and check for `up_to_date` status. Compare `lastSyncAt` against your

        ETL bookmark to determine if new data is available. Note that exports run with a 20-minute lag buffer,

        so `lastSyncAt` will always be at least 20 minutes behind real-time.'
    BlobStorageIntegrationStatusResponse:
      title: BlobStorageIntegrationStatusResponse
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        syncStatus:
          $ref: '#/components/schemas/BlobStorageSyncStatus'
        enabled:
          type: boolean
        lastSyncAt:
          type:
          - string
          - 'null'
          format: date-time
          description: End of the last successfully exported time window. Compare against your ETL bookmark to determine if new data is available. Null if the integration has never synced.
        nextSyncAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next export is scheduled. Null if no sync has occurred yet.
        lastError:
          type:
          - string
          - 'null'
          description: Raw error message from the storage provider (S3/Azure/GCS) if the last export failed. Cleared on successful export.
        lastErrorAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the last error occurred. Cleared on successful export.
      required:
      - id
      - projectId
      - syncStatus
      - enabled
      - lastSyncAt
      - nextSyncAt
      - lastError
      - lastErrorAt
    BlobStorageIntegrationFileTypeResponse:
      title: BlobStorageIntegrationFileTypeResponse
      type: string
      enum:
      - JSON
      - CSV
      - JSONL
      - PARQUET
      description: File type reported for an existing integration.
    BlobStorageIntegrationsResponse:
      title: BlobStorageIntegrationsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BlobStorageIntegrationResponse'
      required:
      - data
    BlobStorageExportFrequency:
      title: BlobStorageExportFrequency
      type: string
      enum:
      - every_20_minutes
      - hourly
      - daily
      - weekly
    BlobStorageIntegrationType:
      title: BlobStorageIntegrationType
      type: string
      enum:
      - S3
      - S3_COMPATIBLE
      - AZURE_BLOB_STORAGE
      - GOOGLE_CLOUD_STORAGE
    BlobStorageExportMode:
      title: BlobStorageExportMode
      type: string
      enum:
      - FULL_HISTORY
      - FROM_TODAY
      - FROM_CUSTOM_DATE
    CreateBlobStorageIntegrationRequest:
      title: CreateBlobStorageIntegrationRequest
      type: object
      properties:
        projectId:
          type: string
          description: ID of the project in which to configure the blob storage integration
        type:
          $ref: '#/components/schemas/BlobStorageIntegrationType'
        bucketName:
          type: string
          description: Name of the storage bucket. For AZURE_BLOB_STORAGE, must be a valid Azure container name (3-63 chars, lowercase letters, numbers, and hyphens only, must start and end with a letter or number, no consecutive hyphens). For GOOGLE_CLOUD_STORAGE with default credentials, the bucket must be listed in `LANGFUSE_BLOB_STORAGE_GCS_ALLOWED_BUCKETS`.
        endpoint:
          type:
          - string
          - 'null'
          description: Custom endpoint URL (required for S3_COMPATIBLE type). Ignored for GOOGLE_CLOUD_STORAGE.
        region:
          type: string
          description: 'Storage region used by S3-compatible clients (AWS, GCS, Cloudflare R2, MinIO, Azure location IDs such as eastus, OCI). Leading and trailing whitespace is removed. The remaining value must be 1-63 letters, numbers, or hyphens, and cannot start or end with a hyphen. Examples: us-east-1, europe-west1, eastus, auto. Not used by GOOGLE_CLOUD_STORAGE; pass auto.'
        accessKeyId:
          type:
          - string
          - 'null'
          description: Access key ID for authentication. Not used for GOOGLE_CLOUD_STORAGE.
        secretAccessKey:
          type:
          - string
          - 'null'
          description: 'Secret access key for authentication (will be encrypted when stored). When omitted on update, the stored secret is kept, unless the type changes between GOOGLE_CLOUD_STORAGE and another type.


            For GOOGLE_CLOUD_STORAGE, a GCP service account JSON key. On self-hosted deployments, pass `__GCS_DEFAULT_CREDENTIALS__` instead to use the deployment''s Application Default Credentials; the bucket must then be listed in `LANGFUSE_BLOB_STORAGE_GCS_ALLOWED_BUCKETS`. Default credentials are not available on Langfuse Cloud.'
        prefix:
          type:
          - string
          - 'null'
          description: Path prefix for exported files (must end with forward slash if provided)
        exportFrequency:
          $ref: '#/components/schemas/BlobStorageExportFrequency'
        enabled:
          type: boolean
          description: Whether the integration is active
        forcePathStyle:
          type: boolean
          description: Use path-style URLs for S3 requests
        fileType:
          $ref: '#/components/schemas/BlobStorageIntegrationFileType'
        exportMode:
          $ref: '#/components/schemas/BlobStorageExportMode'
        exportStartDate:
          type:
          - string
          - 'null'
          format: date-time
          description: Custom start date for exports (required when exportMode is FROM_CUSTOM_DATE). Must not be in the future (27 h tolerance for timezone differences).
        compressed:
          type:
          - boolean
          - 'null'
          description: Enable gzip compression for exported files (.csv.gz, .json.gz, .jsonl.gz). Defaults to true.
        exportSource:
          $ref: '#/components/schemas/BlobStorageExportSource'
          description: 'Data to export. When omitted on update, the existing value is preserved. When omitted on create, the default is `OBSERVATIONS_V2` on Langfuse Cloud, and on self-hosted deployments `LEGACY_TRACES_OBSERVATIONS` — or `OBSERVATIONS_V2` where the deployment no longer populates the legacy tables. The default is never a source the deployment cannot serve. Required when `exportFieldGroups` is provided.


            **Cloud-only project deprecation gate (effective 2026-05-20):** For projects created on or after 2026-05-20 on Langfuse Cloud, `LEGACY_TRACES_OBSERVATIONS` and `LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS` are rejected with HTTP 400. Use `OBSERVATIONS_V2` for all new integrations. Self-hosted deployments are unaffected.


            **Cloud-only integration deprecation gate (effective 2026-06-22):** On Langfuse Cloud, legacy export sources are only accepted for blob storage integrations created before 2026-06-22, regardless of project age. Requests that would create a new integration with `LEGACY_TRACES_OBSERVATIONS` or `LEGACY_TRACES_AND_ENRICHED_OBSERVATIONS` are rejected with HTTP 400. Use `OBSERVATIONS_V2` instead. Self-hosted deployments are unaffected.'
        exportFieldGroups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BlobStorageExportFieldGroup'
          description: 'Field groups to include in each exported observation row. Applies to all export sources; must include `core` if provided. When omitted on create, the column default (all groups) applies. When omitted on update, the existing value is preserved.


            `exportFieldGroups` requires `exportSource` to be provided in the same request.'
      required:
      - projectId
      - type
      - bucketName
      - region
      - exportFrequency
      - enabled
      - forcePathStyle
      - fileType
      - exportMode
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
