components:
  schemas:
    unstableDashboardWidgetFilter:
      title: unstableDashboardWidgetFilter
      type: object
      description: 'A filter in Langfuse filter-state shape. The `value` shape and the

        allowed operators depend on `type`:


        | `type` | `value` | operators |

        |---|---|---|

        | `string` | string | `=`, `contains`, `does not contain`, `starts with`, `ends with` |

        | `number` | number | `=`, `>`, `<`, `>=`, `<=` |

        | `datetime` | ISO datetime string | `>`, `<`, `>=`, `<=` |

        | `boolean` | boolean | `=`, `<>` |

        | `null` | `""` | `is null`, `is not null` |

        | `stringOptions` | list of strings | `any of`, `none of` |

        | `arrayOptions` | list of strings | `any of`, `none of`, `all of` |

        | `categoryOptions` | list of strings (requires `key`) | `any of`, `none of` |

        | `stringObject` | string (requires `key`, e.g. a metadata key) | same as `string` |

        | `numberObject` | number (requires `key`, e.g. a score name) | same as `number` |

        | `booleanObject` | boolean (requires `key`) | `=`, `<>` |'
      properties:
        column:
          type: string
        operator:
          type: string
        type:
          type: string
        value: {}
        key:
          type:
          - string
          - 'null'
      required:
      - column
      - operator
      - type
    unstablePublicApiErrorDetails:
      title: unstablePublicApiErrorDetails
      type: object
      description: Optional structured context attached to an error.
      properties:
        issues:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/unstablePublicApiValidationIssue'
        field:
          type:
          - string
          - 'null'
        column:
          type:
          - string
          - 'null'
        invalidValues:
          type:
          - array
          - 'null'
          items:
            type: string
        allowedValues:
          type:
          - array
          - 'null'
          items:
            type: string
        value:
          type:
          - string
          - 'null'
        retryAfterSeconds:
          type:
          - integer
          - 'null'
        limit:
          type:
          - integer
          - 'null'
        remaining:
          type:
          - integer
          - 'null'
        resetAt:
          type:
          - string
          - 'null'
    unstablePresetPlacement:
      title: unstablePresetPlacement
      type: object
      properties:
        id:
          type: string
        presetId:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
      required:
      - id
      - presetId
      - x
      - y
      - width
      - height
    unstableCreateDashboardPlacementRequest:
      title: unstableCreateDashboardPlacementRequest
      oneOf:
      - type: object
        allOf:
        - type: object
          properties:
            type:
              type: string
              enum:
              - widget
        - $ref: '#/components/schemas/unstableCreateWidgetPlacement'
        required:
        - type
        title: UnstableCreateWidgetPlacement
      - type: object
        allOf:
        - type: object
          properties:
            type:
              type: string
              enum:
              - preset
        - $ref: '#/components/schemas/unstableCreatePresetPlacement'
        required:
        - type
        title: UnstableCreatePresetPlacement
    unstablePublicApiError:
      title: unstablePublicApiError
      type: object
      description: Standard error envelope for unstable public API endpoints.
      properties:
        message:
          type: string
          description: Human-readable description of the failure.
        code:
          $ref: '#/components/schemas/unstablePublicApiErrorCode'
          description: Machine-readable error code.
        details:
          $ref: '#/components/schemas/unstablePublicApiErrorDetails'
          description: Optional structured error context.
      required:
      - message
      - code
    unstableWidgetPlacement:
      title: unstableWidgetPlacement
      type: object
      properties:
        id:
          type: string
        widgetId:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
      required:
      - id
      - widgetId
      - x
      - y
      - width
      - height
    utilsMetaResponse:
      title: utilsMetaResponse
      type: object
      properties:
        page:
          type: integer
          description: current page number
        limit:
          type: integer
          description: number of items per page
        totalItems:
          type: integer
          description: number of total items given the current filters/selection (if any)
        totalPages:
          type: integer
          description: number of total pages given the current limit
      required:
      - page
      - limit
      - totalItems
      - totalPages
    unstablePublicApiValidationIssue:
      title: unstablePublicApiValidationIssue
      type: object
      description: A validation issue returned for malformed request bodies or query parameters.
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: array
          items: {}
      required:
      - code
      - message
      - path
    unstableCreateWidgetPlacement:
      title: unstableCreateWidgetPlacement
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Server-generated when omitted.
        widgetId:
          type: string
        x:
          type:
          - integer
          - 'null'
          description: Grid column (12-column grid). Defaults to `0`.
        y:
          type:
          - integer
          - 'null'
          description: Grid row. Defaults to the first row below all existing tiles.
        width:
          type:
          - integer
          - 'null'
          description: Width in grid columns. Defaults to `6`.
        height:
          type:
          - integer
          - 'null'
          description: Height in grid rows. Defaults to `6`.
      required:
      - widgetId
    unstablePublicApiErrorCode:
      title: unstablePublicApiErrorCode
      type: string
      enum:
      - authentication_failed
      - access_denied
      - invalid_request
      - invalid_query
      - invalid_body
      - resource_not_found
      - conflict
      - rate_limited
      - method_not_allowed
      - internal_error
      description: Machine-readable error code returned by unstable public API endpoints.
    unstableDashboardList:
      title: unstableDashboardList
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/unstableDashboard'
        meta:
          $ref: '#/components/schemas/utilsMetaResponse'
      required:
      - data
      - meta
    unstableUpdateDashboardRequest:
      title: unstableUpdateDashboardRequest
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        definition:
          $ref: '#/components/schemas/unstableDashboardDefinition'
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/unstableDashboardWidgetFilter'
    unstableDashboard:
      title: unstableDashboard
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        description:
          type: string
        definition:
          $ref: '#/components/schemas/unstableDashboardDefinition'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/unstableDashboardWidgetFilter'
          description: Dashboard-level filters applied to all widgets on the dashboard.
      required:
      - id
      - createdAt
      - updatedAt
      - name
      - description
      - definition
      - filters
    unstableCreateDashboardRequest:
      title: unstableCreateDashboardRequest
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        definition:
          $ref: '#/components/schemas/unstableDashboardDefinition'
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/unstableDashboardWidgetFilter'
      required:
      - name
    unstableDeleteDashboardPlacementResponse:
      title: unstableDeleteDashboardPlacementResponse
      type: object
      properties:
        message:
          type: string
      required:
      - message
    unstableCreatePresetPlacement:
      title: unstableCreatePresetPlacement
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Server-generated when omitted.
        presetId:
          type: string
        x:
          type:
          - integer
          - 'null'
          description: Grid column (12-column grid). Defaults to `0`.
        y:
          type:
          - integer
          - 'null'
          description: Grid row. Defaults to the first row below all existing tiles.
        width:
          type:
          - integer
          - 'null'
          description: Width in grid columns. Defaults to `6`.
        height:
          type:
          - integer
          - 'null'
          description: Height in grid rows. Defaults to `6`.
      required:
      - presetId
    unstableDeleteDashboardResponse:
      title: unstableDeleteDashboardResponse
      type: object
      properties:
        message:
          type: string
      required:
      - message
    unstableUpdateDashboardPlacementRequest:
      title: unstableUpdateDashboardPlacementRequest
      type: object
      properties:
        x:
          type:
          - integer
          - 'null'
          description: Grid column (12-column grid).
        y:
          type:
          - integer
          - 'null'
          description: Grid row.
        width:
          type:
          - integer
          - 'null'
          description: Width in grid columns.
        height:
          type:
          - integer
          - 'null'
          description: Height in grid rows.
    unstableDashboardDefinition:
      title: unstableDashboardDefinition
      type: object
      properties:
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/unstableDashboardPlacement'
      required:
      - widgets
    unstableDashboardPlacement:
      title: unstableDashboardPlacement
      oneOf:
      - type: object
        allOf:
        - type: object
          properties:
            type:
              type: string
              enum:
              - widget
        - $ref: '#/components/schemas/unstableWidgetPlacement'
        required:
        - type
