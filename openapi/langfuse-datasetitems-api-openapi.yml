            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Dataset items get
      x-summary-source: derived
    delete:
      description: Delete a dataset item and all its run items. This action is irreversible.
      operationId: datasetItems_delete
      tags:
      - DatasetItems
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
