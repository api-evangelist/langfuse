              schema: {}
      security:
      - BasicAuth: []
      summary: Dataset items delete
      x-summary-source: derived
components:
  schemas:
    PaginatedDatasetItems:
      title: PaginatedDatasetItems
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItem'
        meta:
          $ref: '#/components/schemas/utilsMetaResponse'
      required:
      - data
      - meta
    utilsMetaResponse:
      title: utilsMetaResponse
      type: object
      properties:
        page:
          type: integer
          description: current page number
        limit:
          type: integer
          description: number of items per page
        totalItems:
          type: integer
          description: number of total items given the current filters/selection (if any)
        totalPages:
          type: integer
          description: number of total pages given the current limit
      required:
      - page
      - limit
      - totalItems
      - totalPages
    DatasetItem:
      title: DatasetItem
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        input:
          description: Input data for the dataset item
        expectedOutput:
          description: Expected output for the dataset item
        metadata:
          description: Metadata associated with the dataset item
        sourceTraceId:
          type:
          - string
          - 'null'
          description: The trace ID that sourced this dataset item
        sourceObservationId:
          type:
          - string
          - 'null'
          description: The observation ID that sourced this dataset item
        datasetId:
          type: string
        datasetName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type:
          - string
          - 'null'
          format: date-time
          description: When this version of the dataset item became current. Listing dataset items with a `version` at or after this timestamp returns this item version, until the item is changed again. Self-hosted deployments that set `LANGFUSE_DATASET_SERVICE_WRITE_TO_VERSIONED_IMPLEMENTATION=false` update items in place, so there it stays at the item's first write.
        mediaReferences:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItemMediaReference'
          description: Resolved Langfuse media references found in input, expectedOutput, and metadata.
      required:
      - id
      - status
      - input
      - expectedOutput
      - metadata
      - sourceTraceId
      - sourceObservationId
      - datasetId
      - datasetName
      - createdAt
      - updatedAt
      - mediaReferences
    DatasetItemMediaReferenceField:
      title: DatasetItemMediaReferenceField
      type: string
      enum:
      - input
      - expectedOutput
      - metadata
    DatasetStatus:
      title: DatasetStatus
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
    CreateDatasetItemRequest:
      title: CreateDatasetItemRequest
      type: object
      properties:
        datasetName:
          type: string
        input: {}
        expectedOutput: {}
        metadata: {}
        sourceTraceId:
          type:
          - string
          - 'null'
        sourceObservationId:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
          description: Dataset items are upserted on their id. Id needs to be unique (project-level), cannot be reused across datasets, and must be at most 255 characters.
        status:
          $ref: '#/components/schemas/DatasetStatus'
          description: Defaults to ACTIVE for newly created items
      required:
      - datasetName
    DeleteDatasetItemResponse:
      title: DeleteDatasetItemResponse
      type: object
      properties:
        message:
          type: string
          description: Success message after deletion
      required:
      - message
    DatasetItemMediaReferenceMedia:
      title: DatasetItemMediaReferenceMedia
      type: object
      properties:
        mediaId:
          type: string
          description: The unique langfuse identifier of the media record
        contentType:
          type: string
          description: The MIME type of the media record
        contentLength:
          type: integer
          description: The size of the media record in bytes
        url:
          type: string
          description: The signed download URL of the media record
        urlExpiry:
          type: string
          description: The expiry date and time of the download URL
      required:
      - mediaId
      - contentType
      - contentLength
      - url
      - urlExpiry
    DatasetItemMediaReference:
      title: DatasetItemMediaReference
      type: object
      properties:
        field:
          $ref: '#/components/schemas/DatasetItemMediaReferenceField'
          description: The dataset item field containing the reference
        referenceString:
          type: string
          description: The Langfuse media reference string, e.g. `@@@langfuseMedia:type=image/png|id=...|source=bytes@@@`
        jsonPath:
          type: string
          description: JSONPath of the string holding the reference within the field, e.g. `$['image']`
        media:
          $ref: '#/components/schemas/DatasetItemMediaReferenceMedia'
          description: The resolved media record.
      required:
      - field
      - referenceString
      - jsonPath
      - media
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
