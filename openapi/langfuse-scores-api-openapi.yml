openapi: 3.2.0
info:
  title: server Scores API
  version: ''
  description: '## Real-time data


    The only real-time path to get tracing data is to ingest via OpenTelemetry (`POST /api/public/otel/v1/traces`) and retrieve via Observations API v2 (`GET /api/public/v2/observations`) and Metrics API v2 (`GET /api/public/v2/metrics`). Other public API write and read endpoints can delay data by about 10 minutes. Direct OpenTelemetry exporters must send the `x-langfuse-ingestion-version: 4` header; current Python and JS SDKs already do. See the Public API docs and real-time ingestion.


    ## Authentication


    Authenticate with the API using Basic Auth, get API keys in the project settings:


    - username: Langfuse Public Key

    - password: Langfuse Secret Key


    ## Exports


    - OpenAPI spec: https://cloud.langfuse.com/generated/api/openapi.yml

    - Self-hosted deployments: interactive API reference at `/api/docs` and OpenAPI spec at `/api/openapi.yaml`'
tags:
- name: Scores
paths:
  /api/public/scores:
    post:
      description: Create scores asynchronously from a list of scores. Returns 202 if all scores are accepted, or 207 with accepted/rejected counts and error messages. Do not automatically retry a 207 batch. The generated reference shows only 200; the endpoint returns 202 or 207.
      operationId: scores_create
      tags:
      - Scores
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScoresResponse'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoresRequest'
      summary: Scores create
      x-summary-source: derived
  /api/public/scores/{scoreId}:
    delete:
      description: Delete a score (supports both trace and session scores)
      operationId: scores_delete
      tags:
      - Scores
      parameters:
      - name: scoreId
        in: path
        description: The unique langfuse identifier of a score
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Scores delete
      x-summary-source: derived
  /api/public/v3/scores:
    get:
      description: 'Get a list of scores with a polymorphic `value` field (v3).


        The `value` field type depends on `dataType`:

        - `NUMERIC` → number

        - `BOOLEAN` → boolean

        - `CATEGORICAL`, `TEXT`, `CORRECTION` → string


        The response always includes the core fields: id, projectId, name,

        value, dataType, source, timestamp, environment, createdAt, updatedAt.


        Additional field groups can be requested via the `fields` parameter:

        - `details` — adds comment, configId, metadata

        - `subject` — adds the subject object describing the entity the score

        is attached to: kind (trace, observation, session, or experiment),

        id, and traceId for observation-level scores

        - `annotation` — adds authorUserId, queueId


        Unknown group names return HTTP 400.'
      operationId: scores_getMany
      tags:
      - Scores
      parameters:
      - name: limit
        in: query
        description: Number of items per page. Maximum 100, default 50. Requests with a limit greater than 100 return HTTP 400.
        required: false
        schema:
          type:
          - integer
          - 'null'
      - name: cursor
        in: query
        description: URL-safe base64 (base64url) cursor for pagination. Use the cursor from the previous response to get the next page. Absent on the final page.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: fields
        in: query
        description: 'Comma-separated field groups to include in addition to the always-returned core fields. Allowed: details, subject, annotation — see the endpoint description for the fields each group adds. Unknown names return HTTP 400.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: id
        in: query
        description: Comma-separated list of score IDs to filter by (OR within, AND across filters).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: name
        in: query
        description: Comma-separated list of score names to filter by.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: source
        in: query
        description: Comma-separated list of score sources to filter by (e.g. API, ANNOTATION, EVAL). Case-insensitive — `api` and `API` are equivalent.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: dataType
        in: query
        description: Comma-separated list of data types to filter by (NUMERIC, BOOLEAN, CATEGORICAL, TEXT, CORRECTION). Case-insensitive — `numeric` and `NUMERIC` are equivalent. Must be a single value when used with value, valueMin, or valueMax; otherwise the request returns HTTP 400. Must be NUMERIC when used with valueMin or valueMax.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: environment
        in: query
        description: Comma-separated list of environments to filter by.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: configId
        in: query
        description: Comma-separated list of score config IDs to filter by.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: queueId
        in: query
        description: Comma-separated list of annotation queue IDs to filter by.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: authorUserId
        in: query
        description: Comma-separated list of author user IDs to filter by.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: value
        in: query
        description: Comma-separated list of exact values to filter by. Requires a single dataType from NUMERIC, BOOLEAN, or CATEGORICAL; any other dataType, multiple dataTypes, or omitting dataType returns HTTP 400. For BOOLEAN, each value must be "true" or "false"; for NUMERIC, each value must be a finite number. Otherwise the request returns HTTP 400.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: valueMin
        in: query
        description: Inclusive lower bound on the numeric value. Requires dataType=NUMERIC as a single value; otherwise the request returns HTTP 400.
        required: false
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: valueMax
        in: query
        description: Inclusive upper bound on the numeric value. Requires dataType=NUMERIC as a single value; otherwise the request returns HTTP 400.
        required: false
        schema:
          type:
          - number
          - 'null'
          format: double
      - name: traceId
        in: query
        description: Comma-separated list of trace IDs to filter by. Mutually exclusive with sessionId, experimentId. May be combined with observationId to scope the observation lookup to a specific trace.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: sessionId
        in: query
        description: Comma-separated list of session IDs to filter by. Mutually exclusive with traceId, observationId, experimentId.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: observationId
        in: query
        description: Comma-separated list of observation IDs to filter by. Requires traceId to be specified, because observation IDs are scoped to a trace. Mutually exclusive with sessionId, experimentId. Returns HTTP 400 when used without traceId.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: experimentId
        in: query
        description: Comma-separated list of dataset run IDs (experiment IDs) to filter by. Mutually exclusive with traceId, sessionId, observationId.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: fromTimestamp
        in: query
        description: Inclusive lower bound on the score timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: toTimestamp
        in: query
        description: Exclusive upper bound on the score timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScoresV3Response'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Scores get many
      x-summary-source: derived
components:
  schemas:
    BaseScoreV3:
      title: BaseScoreV3
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        source:
          $ref: '#/components/schemas/ScoreSource'
        timestamp:
          type: string
          format: date-time
        environment:
          type: string
          description: The environment from which this score originated.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        comment:
          type:
          - string
          - 'null'
          description: Optional comment attached to the score. Present when "details" is included in the fields parameter.
        configId:
          type:
          - string
          - 'null'
          description: The score config ID, if this score was created from a config. Present when "details" is included in the fields parameter.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Arbitrary metadata attached to the score. Present when "details" is included in the fields parameter.
        authorUserId:
          type:
          - string
          - 'null'
          description: The user who created this score, if available. Present when "annotation" is included in the fields parameter.
        queueId:
          type:
          - string
          - 'null'
          description: The annotation queue this score belongs to, if any. Present when "annotation" is included in the fields parameter.
        subject:
          $ref: '#/components/schemas/ScoreSubjectV3'
          description: The entity this score is attached to (trace, observation, session, or experiment). Present when "subject" is included in the fields parameter.
      required:
      - id
      - projectId
      - name
      - source
      - timestamp
      - environment
      - createdAt
      - updatedAt
    ScoreSubjectObservationV3:
      title: ScoreSubjectObservationV3
      type: object
      properties:
        id:
          type: string
          description: The observation ID.
        traceId:
          type:
          - string
          - 'null'
          description: The parent trace ID, if available.
      required:
      - id
    ScoreSubjectV3:
      title: ScoreSubjectV3
      oneOf:
      - type: object
        allOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
              - trace
        - $ref: '#/components/schemas/ScoreSubjectTraceV3'
        required:
        - kind
        title: ScoreSubjectTraceV3
      - type: object
        allOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
              - observation
        - $ref: '#/components/schemas/ScoreSubjectObservationV3'
        required:
        - kind
        title: ScoreSubjectObservationV3
      - type: object
        allOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
              - session
        - $ref: '#/components/schemas/ScoreSubjectSessionV3'
        required:
        - kind
        title: ScoreSubjectSessionV3
      - type: object
        allOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
              - experiment
        - $ref: '#/components/schemas/ScoreSubjectExperimentV3'
        required:
        - kind
        title: ScoreSubjectExperimentV3
      description: A reference to the entity this score is attached to. Discriminated by "kind" — one of trace, observation, session, or experiment.
    CreateScoresResponse:
      title: CreateScoresResponse
      oneOf:
      - $ref: '#/components/schemas/CreateScoreBatchResults'
      - $ref: '#/components/schemas/CreateScoreBatchResponse'
    ScoreV3:
      title: ScoreV3
      oneOf:
      - type: object
        allOf:
        - type: object
          properties:
            dataType:
              type: string
              enum:
              - NUMERIC
        - $ref: '#/components/schemas/NumericScoreV3'
        required:
        - dataType
        title: NumericScoreV3
      - type: object
        allOf:
        - type: object
          properties:
            dataType:
              type: string
              enum:
              - BOOLEAN
        - $ref: '#/components/schemas/BooleanScoreV3'
        required:
        - dataType
        title: BooleanScoreV3
      - type: object
        allOf:
        - type: object
          properties:
            dataType:
              type: string
              enum:
              - CATEGORICAL
        - $ref: '#/components/schemas/CategoricalScoreV3'
        required:
        - dataType
        title: CategoricalScoreV3
      - type: object
        allOf:
        - type: object
          properties:
            dataType:
              type: string
              enum:
              - TEXT
        - $ref: '#/components/schemas/TextScoreV3'
        required:
        - dataType
        title: TextScoreV3
      - type: object
        allOf:
        - type: object
          properties:
            dataType:
              type: string
              enum:
              - CORRECTION
        - $ref: '#/components/schemas/CorrectionScoreV3'
        required:
        - dataType
        title: CorrectionScoreV3
    ScoreSubjectSessionV3:
      title: ScoreSubjectSessionV3
      type: object
      properties:
        id:
          type: string
          description: The session ID.
      required:
      - id
    ScoreDataType:
      title: ScoreDataType
      type: string
      enum:
      - NUMERIC
      - BOOLEAN
      - CATEGORICAL
      - CORRECTION
      - TEXT
    BooleanScoreV3:
      title: BooleanScoreV3
      type: object
      properties:
        value:
          type: boolean
          description: The boolean value of the score.
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/BaseScoreV3'
    TextScoreV3:
      title: TextScoreV3
      type: object
      properties:
        value:
          type: string
          description: The text content of the score.
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/BaseScoreV3'
    NumericScoreV3:
      title: NumericScoreV3
      type: object
      properties:
        value:
          type: number
          format: double
          description: The numeric value of the score.
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/BaseScoreV3'
    CreateScoreBatchResponse:
      title: CreateScoreBatchResponse
      type: object
      description: Batch accepted (HTTP 202).
      properties:
        message:
          type: string
          const: Accepted
      required:
      - message
    ScoreSubjectExperimentV3:
      title: ScoreSubjectExperimentV3
      type: object
      properties:
        id:
          type: string
          description: The dataset run ID (experiment ID).
      required:
      - id
    CategoricalScoreV3:
      title: CategoricalScoreV3
      type: object
      properties:
        value:
          type: string
          description: The string category value of the score.
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/BaseScoreV3'
    GetScoresV3Meta:
      title: GetScoresV3Meta
      type: object
      properties:
        limit:
          type: integer
      required:
      - limit
      allOf:
      - $ref: '#/components/schemas/utilsCursorMetaResponse'
    ScoreSource:
      title: ScoreSource
      type: string
      enum:
      - ANNOTATION
      - API
      - EVAL
    CorrectionScoreV3:
      title: CorrectionScoreV3
      type: object
      properties:
        value:
          type: string
          description: The correction content of the score. Empty string if not set.
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/BaseScoreV3'
    utilsCursorMetaResponse:
      title: utilsCursorMetaResponse
      type: object
      description: Metadata for cursor-based pagination.
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page. Omitted when there is no next page.
    GetScoresV3Response:
      title: GetScoresV3Response
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScoreV3'
        meta:
          $ref: '#/components/schemas/GetScoresV3Meta'
      required:
      - data
      - meta
    CreateScoreRequest:
      title: CreateScoreRequest
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
        sessionId:
          type:
          - string
          - 'null'
        observationId:
          type:
          - string
          - 'null'
        datasetRunId:
          type:
          - string
          - 'null'
        name:
          type: string
        value:
          $ref: '#/components/schemas/CreateScoreValue'
          description: The value of the score. Must be passed as string for categorical and text scores, and numeric for boolean and numeric scores. Boolean score values must equal either 1 or 0 (true or false). Text score values must be between 1 and 500 characters.
        comment:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        environment:
          type:
          - string
          - 'null'
          description: The environment of the score. Can be any lowercase alphanumeric string with hyphens and underscores that does not start with 'langfuse'.
        queueId:
          type:
          - string
          - 'null'
          description: The annotation queue referenced by the score. Indicates if score was initially created while processing annotation queue.
        dataType:
          $ref: '#/components/schemas/ScoreDataType'
          description: The data type of the score. When passing a configId this field is inferred. Otherwise, this field must be passed or will default to numeric.
        configId:
          type:
          - string
          - 'null'
          description: Reference a score config on a score. The unique langfuse identifier of a score config. When passing this field, the dataType and stringValue fields are automatically populated.
        source:
          $ref: '#/components/schemas/CreateScoreSource'
          description: The source of the score. Defaults to API. Set to ANNOTATION to prefill scores (e.g. from an LLM) for a human reviewer to verify in an annotation queue. When source is ANNOTATION, a configId is required unless dataType is CORRECTION. EVAL is reserved for internal evaluator outputs and is not accepted on this endpoint.
        timestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp of the score, as an ISO 8601 datetime with a timezone offset. Defaults to the time the request is received. To update an existing score, send it again with the same id and timestamp.
      required:
      - name
      - value
    CreateScoreSource:
      title: CreateScoreSource
      type: string
      enum:
      - API
      - ANNOTATION
      description: 'Source values accepted when creating a score via the public REST API.

        EVAL is reserved for internal evaluator outputs and is intentionally not

        exposed here — use commons.ScoreSource when reading scores.'
    ScoreSubjectTraceV3:
      title: ScoreSubjectTraceV3
      type: object
      properties:
        id:
          type: string
          description: The trace ID.
      required:
      - id
    CreateScoreValue:
      title: CreateScoreValue
      oneOf:
      - type: number
        format: double
        title: DoubleNumber
      - type: string
        title: String
      description: The value of the score. Must be passed as string for categorical and text scores, and numeric for boolean and numeric scores
    CreateScoresRequest:
      title: CreateScoresRequest
      type: array
      items:
        $ref: '#/components/schemas/CreateScoreRequest'
    CreateScoreBatchResults:
      title: CreateScoreBatchResults
      type: object
      description: Acceptance counts and errors (HTTP 207).
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CreateScoreBatchError'
      required:
      - accepted
      - rejected
      - errors
    CreateScoreBatchError:
      title: CreateScoreBatchError
      type: object
      properties:
        message:
          type: string
      required:
      - message
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
