components:
  schemas:
    DeleteMembershipRequest:
      title: DeleteMembershipRequest
      type: object
      properties:
        userId:
          type: string
      required:
      - userId
    OrganizationProject:
      title: OrganizationProject
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - createdAt
      - updatedAt
    MembershipsResponse:
      title: MembershipsResponse
      type: object
      properties:
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'
      required:
      - memberships
    MembershipResponse:
      title: MembershipResponse
      type: object
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/MembershipRole'
        email:
          type: string
        name:
          type: string
      required:
      - userId
      - role
      - email
      - name
    MembershipRole:
      title: MembershipRole
      type: string
      enum:
      - OWNER
      - ADMIN
      - MEMBER
      - VIEWER
    MembershipDeletionResponse:
      title: MembershipDeletionResponse
      type: object
      properties:
        message:
          type: string
        userId:
          type: string
      required:
      - message
      - userId
    MembershipRequest:
      title: MembershipRequest
      type: object
      properties:
        userId:
          type: string
        role:
          $ref: '#/components/schemas/MembershipRole'
      required:
      - userId
      - role
    OrganizationProjectsResponse:
      title: OrganizationProjectsResponse
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationProject'
      required:
      - projects
    OrganizationApiKeysResponse:
      title: OrganizationApiKeysResponse
      type: object
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationApiKey'
      required:
      - apiKeys
    OrganizationApiKey:
      title: OrganizationApiKey
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiration timestamp. Null if the key does not expire.
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type:
          - string
          - 'null'
          description: Name of the API key. Contains the same value as note; null if no name was provided.
        note:
          type:
          - string
          - 'null'
          description: Deprecated alias for name. Contains the same value as name.
          deprecated: true
        publicKey:
          type: string
        displaySecretKey:
          type: string
      required:
      - id
      - createdAt
      - publicKey
      - displaySecretKey
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
