openapi: 3.2.0
info:
  title: server Unstable Skills API
  version: ''
  description: '## Real-time data


    The only real-time path to get tracing data is to ingest via OpenTelemetry (`POST /api/public/otel/v1/traces`) and retrieve via Observations API v2 (`GET /api/public/v2/observations`) and Metrics API v2 (`GET /api/public/v2/metrics`). Other public API write and read endpoints can delay data by about 10 minutes. Direct OpenTelemetry exporters must send the `x-langfuse-ingestion-version: 4` header; current Python and JS SDKs already do. See the Public API docs and real-time ingestion.


    ## Authentication


    Authenticate with the API using Basic Auth, get API keys in the project settings:


    - username: Langfuse Public Key

    - password: Langfuse Secret Key


    ## Exports


    - OpenAPI spec: https://cloud.langfuse.com/generated/api/openapi.yml

    - Self-hosted deployments: interactive API reference at `/api/docs` and OpenAPI spec at `/api/openapi.yaml`'
tags:
- name: UnstableSkills
paths:
  /api/public/unstable/skills:
    get:
      description: List skills with metadata and timestamps from their latest version, shared tags, and the version assigned to production when present.
      operationId: unstable_skills_list
      tags:
      - UnstableSkills
      parameters:
      - name: name
        in: query
        description: Filter by exact skill name.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: search
        in: query
        description: Case-insensitive search across skill names and latest-version descriptions.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: tag
        in: query
        description: Filter by a shared skill tag.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: page
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
      - name: fromUpdatedAt
        in: query
        description: Include skills whose latest version was updated at or after this timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      - name: toUpdatedAt
        in: query
        description: Include skills whose latest version was updated before this timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
          format: date-time
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillMetaListResponse'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Unstable skills list
      x-summary-source: derived
    post:
      description: Create skill version
      operationId: unstable_skills_createVersion
      tags:
      - UnstableSkills
      parameters: []
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillVersion'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/unstableCreateSkillVersionRequest'
      summary: Unstable skills create version
      x-summary-source: derived
  /api/public/unstable/skills/{skillName}:
    get:
      description: Resolve a skill's metadata and file manifest by version or label. Defaults to the production label. Set includeContent to return file contents inline, or use each file's sha256Hash with getFileContents.
      operationId: unstable_skills_get
      tags:
      - UnstableSkills
      parameters:
      - name: skillName
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
      - name: label
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: includeContent
        in: query
        description: Include UTF-8 text content in each file. Defaults to false.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillVersion'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Unstable skills get
      x-summary-source: derived
    patch:
      description: Replace the shared tags across all versions of a skill. An empty tags list clears all tags. Returns the latest skill version with the updated tags.
      operationId: unstable_skills_update
      tags:
      - UnstableSkills
      parameters:
      - name: skillName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillVersion'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/unstableUpdateSkillRequest'
      summary: Unstable skills update
      x-summary-source: derived
  /api/public/unstable/skills/files/content:
    get:
      description: Read a batch of text contents by canonical base64-encoded SHA-256 hashes.
      operationId: unstable_skills_getFileContents
      tags:
      - UnstableSkills
      parameters:
      - name: sha256Hashes
        in: query
        description: Comma-separated list of one to 50 canonical base64-encoded SHA-256 hashes from skill file manifests. URL-encode the value, including +, /, and = characters.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillFileContentsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Unstable skills get file contents
      x-summary-source: derived
  /api/public/unstable/skills/{skillName}/versions/{skillVersion}:
    patch:
      description: Replace the labels on a skill version and atomically move them from other versions.
      operationId: unstable_skills_setLabels
      tags:
      - UnstableSkills
      parameters:
      - name: skillName
        in: path
        required: true
        schema:
          type: string
      - name: skillVersion
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableSkillVersion'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/unstableUpdateSkillLabelsRequest'
      summary: Unstable skills set labels
      x-summary-source: derived
    delete:
      description: Delete one immutable skill version. Unreferenced blobs are retained for asynchronous cleanup.
      operationId: unstable_skills_deleteVersion
      tags:
      - UnstableSkills
      parameters:
      - name: skillName
        in: path
        required: true
        schema:
          type: string
      - name: skillVersion
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unstableDeleteSkillVersionResponse'
        '400':
          description: ''
          content:
            application/json:
              schema: {}
        '401':
          description: ''
          content:
            application/json:
              schema: {}
        '403':
          description: ''
          content:
            application/json:
              schema: {}
        '404':
          description: ''
          content:
            application/json:
              schema: {}
        '405':
          description: ''
          content:
            application/json:
              schema: {}
      security:
      - BasicAuth: []
      summary: Unstable skills delete version
      x-summary-source: derived
components:
  schemas:
    unstableUpdateSkillLabelsRequest:
      title: unstableUpdateSkillLabelsRequest
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
      required:
      - labels
    unstableSkillVersionFileInput:
      title: unstableSkillVersionFileInput
      type: object
      properties:
        path:
          type: string
        content:
          type: string
          description: UTF-8 text content. The server computes the hash and byte length.
      required:
      - path
      - content
    utilsMetaResponse:
      title: utilsMetaResponse
      type: object
      properties:
        page:
          type: integer
          description: current page number
        limit:
          type: integer
          description: number of items per page
        totalItems:
          type: integer
          description: number of total items given the current filters/selection (if any)
        totalPages:
          type: integer
          description: number of total pages given the current limit
      required:
      - page
      - limit
      - totalItems
      - totalPages
    unstableCreateSkillVersionRequest:
      title: unstableCreateSkillVersionRequest
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/unstableSkillVersionFileCreateInput'
        commitMessage:
          type:
          - string
          - 'null'
      required:
      - files
    unstableSkillVersionFileReference:
      title: unstableSkillVersionFileReference
      type: object
      properties:
        path:
          type: string
        sha256Hash:
          type: string
          description: Canonical base64-encoded SHA-256 from a skill file manifest. The content must already exist in this project.
      required:
      - path
      - sha256Hash
    unstableDeleteSkillVersionResponse:
      title: unstableDeleteSkillVersionResponse
      type: object
      properties:
        deleted:
          type: boolean
      required:
      - deleted
    unstableSkillFile:
      title: unstableSkillFile
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        blobId:
          type: string
        sha256Hash:
          type: string
        contentType:
          type: string
        contentLength:
          type: integer
          format: int64
        content:
          type:
          - string
          - 'null'
          description: UTF-8 text content, included when fetching a skill with includeContent enabled.
      required:
      - id
      - path
      - blobId
      - sha256Hash
      - contentType
      - contentLength
    unstableSkillFileContent:
      title: unstableSkillFileContent
      type: object
      properties:
        sha256Hash:
          type: string
        content:
          type: string
      required:
      - sha256Hash
      - content
    unstableSkillVersion:
      title: unstableSkillVersion
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        projectId:
          type: string
        createdBy:
          type: string
        name:
          type: string
        description:
          type: string
        frontmatter: {}
        version:
          type: integer
        tags:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        commitMessage:
          type:
          - string
          - 'null'
        files:
          type: array
          items:
            $ref: '#/components/schemas/unstableSkillFile'
      required:
      - id
      - createdAt
      - updatedAt
      - projectId
      - createdBy
      - name
      - description
      - frontmatter
      - version
      - tags
      - labels
      - commitMessage
      - files
    unstableSkillMetaListResponse:
      title: unstableSkillMetaListResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/unstableSkillMeta'
        meta:
          $ref: '#/components/schemas/unstableSkillListPagination'
      required:
      - data
      - meta
    unstableSkillVersionFileCreateInput:
      title: unstableSkillVersionFileCreateInput
      oneOf:
      - $ref: '#/components/schemas/unstableSkillVersionFileInput'
      - $ref: '#/components/schemas/unstableSkillVersionFileReference'
      description: Provide exactly one of content or sha256Hash for each path.
    unstableUpdateSkillRequest:
      title: unstableUpdateSkillRequest
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: The complete set of tags to apply to every version of the skill. Pass an empty list to clear all tags.
      required:
      - tags
    unstableSkillMeta:
      title: unstableSkillMeta
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        latestVersion:
          type: integer
        latestVersionCreatedAt:
          type: string
          format: date-time
        latestVersionLastUpdatedAt:
          type: string
          format: date-time
        productionVersion:
          type:
          - integer
          - 'null'
          description: Version assigned the production label, or null when no version is assigned.
      required:
      - name
      - description
      - tags
      - latestVersion
      - latestVersionCreatedAt
      - latestVersionLastUpdatedAt
      - productionVersion
    unstableSkillFileContentsResponse:
      title: unstableSkillFileContentsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/unstableSkillFileContent'
      required:
      - data
    unstableSkillListPagination:
      title: unstableSkillListPagination
      type: object
      properties:
        hasNextPage:
          type: boolean
      required:
      - hasNextPage
      allOf:
      - $ref: '#/components/schemas/utilsMetaResponse'
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
