          type: string
        message:
          type: string
        path:
          type: array
          items: {}
      required:
      - code
      - message
      - path
    unstableDashboardWidgetView:
      title: unstableDashboardWidgetView
      type: string
      enum:
      - observations
      - scores-numeric
      - scores-boolean
      - scores-categorical
    unstableCreateDashboardWidgetRequest:
