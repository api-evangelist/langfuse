      - method_not_allowed
      - internal_error
      description: Machine-readable error code returned by unstable public API endpoints.
    unstableDashboardWidgetDimension:
      title: unstableDashboardWidgetDimension
      type: object
      properties:
        field:
          type: string
      required:
