aid: langfuse
url: https://raw.githubusercontent.com/api-evangelist/langfuse/refs/heads/main/apis.yml
name: Langfuse
kind: company
description: >-
  Langfuse is an open-source LLM engineering platform offering tracing, evaluations, prompt management, datasets, and
  metrics. The Langfuse API supports both self-hosted and multi-region cloud deployments (US, EU, Japan, HIPAA-compliant
  US) and integrates with LangChain, LlamaIndex, OpenTelemetry, and any LLM stack.
